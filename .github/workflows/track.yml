name: Track prices

on:
  # 5x daily, ~30 min after each UDR pricing refresh.
  # UDR refreshes at 6am, 9am, 12pm, 3pm PT.
  # Times below are UTC aligned to PDT (UTC-7); during PST (Nov-Mar) runs
  # shift to 1 hour later in PT, still safely after the refresh window.
  #   13:34 UTC = 06:34 PT  (after 6am refresh)
  #   16:38 UTC = 09:38 PT  (after 9am refresh)
  #   19:41 UTC = 12:41 PT  (after 12pm refresh)
  #   22:36 UTC = 15:36 PT  (after 3pm refresh)
  #   04:11 UTC = 21:11 PT prior day (evening fallback)
  schedule:
    - cron: "34 13 * * *"
    - cron: "38 16 * * *"
    - cron: "41 19 * * *"
    - cron: "36 22 * * *"
    - cron: "11 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (if not cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cache-hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Scrape
        run: npm run track

      - name: Commit and push if CSV changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/prices.csv)" ]]; then
            git add data/prices.csv
            git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Retry-on-conflict: another job's push could land between our
            # checkout and push. Rebase and retry up to 3x.
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push failed (attempt $i), rebasing..."
              git pull --rebase origin main
            done
            exit 1
          else
            echo "No CSV changes to commit."
          fi
