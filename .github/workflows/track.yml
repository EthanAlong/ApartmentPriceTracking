name: Track prices

on:
  # 3x daily, jittered minutes so we don't show up exactly on the hour.
  # GitHub cron is UTC. LA is UTC-7 (PDT) most of the year.
  # 16:17 UTC = 09:17 PT   (morning)
  # 21:43 UTC = 14:43 PT   (afternoon)
  # 03:11 UTC = 20:11 PT prior day (evening)
  schedule:
    - cron: "17 16 * * *"
    - cron: "43 21 * * *"
    - cron: "11 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (if not cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cache-hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Scrape
        run: npm run track

      - name: Commit and push if CSV changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/prices.csv)" ]]; then
            git add data/prices.csv
            git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Retry-on-conflict: another job's push could land between our
            # checkout and push. Rebase and retry up to 3x.
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push failed (attempt $i), rebasing..."
              git pull --rebase origin main
            done
            exit 1
          else
            echo "No CSV changes to commit."
          fi
