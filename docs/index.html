<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Westerly on Lincoln · Price Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    :root {
      --bg: #fafaf7;
      --card: #ffffff;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e5e3dc;
      --accent: #0a6e5b;
      --accent-soft: #e6f2ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 24px 16px 64px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }
    h1 .sub { color: var(--muted); font-weight: 400; font-size: 14px; }
    .meta { color: var(--muted); font-size: 13px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
    }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-group label {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pills { display: flex; gap: 4px; }
    .pill {
      padding: 5px 12px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink);
    }
    .pill.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    input[type="number"] {
      width: 64px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font: inherit;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stats .card { margin-bottom: 0; }
    .stat .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .stat .value {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .chart-wrap { position: relative; height: 380px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    th {
      font-weight: 600;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    tr:last-child td { border-bottom: none; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    th.num { text-align: right; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-style: italic;
    }
    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>
        The Westerly on Lincoln
        <span class="sub">· Marina del Rey · UDR</span>
      </h1>
      <div class="meta" id="meta">Loading…</div>
    </header>

    <div class="card filters">
      <div class="filter-group">
        <label>Bedrooms</label>
        <div class="pills" id="bedsPills">
          <button class="pill" data-beds="">Any</button>
          <button class="pill" data-beds="0">Studio</button>
          <button class="pill active" data-beds="1">1</button>
          <button class="pill" data-beds="2">2</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Sqft</label>
        <input type="number" id="sqftMin" value="700" min="0" step="10" />
        <span style="color: var(--muted)">–</span>
        <input type="number" id="sqftMax" value="900" min="0" step="10" />
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="card">
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>

    <div class="card">
      <div id="table"></div>
    </div>

    <footer>
      Data scraped 3x daily from
      <a href="https://www.udr.com/los-angeles-apartments/marina-del-rey/the-westerly-on-lincoln/apartments-pricing/">UDR's pricing page</a>
      ·
      <a href="https://github.com/EthanAlong/ApartmentPriceTracking">source on GitHub</a>
    </footer>
  </div>

  <script>
    const CSV_URL =
      "https://raw.githubusercontent.com/EthanAlong/ApartmentPriceTracking/main/data/prices.csv";

    // Bust raw.githubusercontent.com's cache (~5 min) so reloading actually
    // shows the latest scrape without a hard refresh.
    const csvUrlWithCacheBust = () =>
      CSV_URL + "?t=" + Math.floor(Date.now() / 60000);

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const header = lines.shift().split(",");
      return lines.map((line) => {
        // Lightweight CSV split: handles plain values and "quoted, with comma"
        const cells = [];
        let cur = "", inQ = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (inQ) {
            if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
            else if (c === '"') inQ = false;
            else cur += c;
          } else {
            if (c === ",") { cells.push(cur); cur = ""; }
            else if (c === '"') inQ = true;
            else cur += c;
          }
        }
        cells.push(cur);
        const row = {};
        header.forEach((h, i) => (row[h] = cells[i]));
        return row;
      });
    }

    const state = {
      rows: [],
      beds: "1",
      sqftMin: 700,
      sqftMax: 900,
    };
    let chart = null;

    function applyFilters() {
      return state.rows.filter((r) => {
        if (state.beds !== "" && String(r.beds) !== state.beds) return false;
        const s = Number(r.sqft);
        if (s < state.sqftMin || s > state.sqftMax) return false;
        return true;
      });
    }

    function fmt(n) {
      if (n == null || isNaN(n)) return "—";
      return "$" + Number(n).toLocaleString();
    }

    function render() {
      const filtered = applyFilters();

      // Stats from the LATEST timestamp only
      const latestTs = state.rows.reduce(
        (acc, r) => (r.timestamp > acc ? r.timestamp : acc),
        "",
      );
      const latest = filtered.filter((r) => r.timestamp === latestTs);
      const rents = latest.map((r) => Number(r.rent)).filter((n) => !isNaN(n));
      const min = rents.length ? Math.min(...rents) : null;
      const max = rents.length ? Math.max(...rents) : null;
      const avg = rents.length
        ? Math.round(rents.reduce((a, b) => a + b, 0) / rents.length)
        : null;

      document.getElementById("stats").innerHTML = `
        <div class="card stat"><div class="label">Available</div><div class="value">${latest.length}</div></div>
        <div class="card stat"><div class="label">Min rent</div><div class="value">${fmt(min)}</div></div>
        <div class="card stat"><div class="label">Avg rent</div><div class="value">${fmt(avg)}</div></div>
        <div class="card stat"><div class="label">Max rent</div><div class="value">${fmt(max)}</div></div>
      `;

      // Chart: one line per unit, x = timestamp, y = rent
      const byUnit = new Map();
      for (const r of filtered) {
        if (!byUnit.has(r.unit)) byUnit.set(r.unit, []);
        byUnit.get(r.unit).push({ x: new Date(r.timestamp), y: Number(r.rent) });
      }
      for (const arr of byUnit.values()) arr.sort((a, b) => a.x - b.x);

      const colors = [
        "#0a6e5b", "#c14a3b", "#3b6cc1", "#c19c3b", "#7a3bc1",
        "#3bc1a8", "#c13b85", "#5a8c2e", "#8c2e5a", "#2e5a8c",
        "#a06030", "#404040",
      ];
      const datasets = [...byUnit.entries()].map(([unit, pts], i) => ({
        label: unit,
        data: pts,
        borderColor: colors[i % colors.length],
        backgroundColor: colors[i % colors.length],
        tension: 0.2,
        pointRadius: 3,
        borderWidth: 2,
      }));

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "nearest", intersect: false },
          scales: {
            x: {
              type: "time",
              time: { tooltipFormat: "MMM d, HH:mm" },
              ticks: { color: "#6b6b6b" },
              grid: { color: "#f0eee7" },
            },
            y: {
              ticks: {
                color: "#6b6b6b",
                callback: (v) => "$" + v.toLocaleString(),
              },
              grid: { color: "#f0eee7" },
            },
          },
          plugins: {
            legend: { position: "bottom", labels: { boxWidth: 12, padding: 12 } },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: $${ctx.parsed.y.toLocaleString()}`,
              },
            },
          },
        },
      });

      // Table of currently available
      if (latest.length === 0) {
        document.getElementById("table").innerHTML =
          '<div class="empty">No units match current filters.</div>';
      } else {
        const sorted = [...latest].sort((a, b) => Number(a.rent) - Number(b.rent));
        const rows = sorted
          .map(
            (r) => `
            <tr>
              <td><strong>${r.unit}</strong></td>
              <td>${r.floorplan_name || ""} ${r.floorplan_code ? `<span class="badge">${r.floorplan_code}</span>` : ""}</td>
              <td class="num">${r.beds}B / ${r.baths}B</td>
              <td class="num">${Number(r.sqft).toLocaleString()}</td>
              <td class="num">${r.floor || "—"}</td>
              <td class="num"><strong>${fmt(Number(r.rent))}</strong></td>
              <td>${r.available_date}</td>
            </tr>`,
          )
          .join("");
        document.getElementById("table").innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Unit</th><th>Floorplan</th>
                <th class="num">Beds/Baths</th><th class="num">Sqft</th>
                <th class="num">Floor</th><th class="num">Rent</th>
                <th>Available</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }
    }

    function attachFilters() {
      document.querySelectorAll("#bedsPills .pill").forEach((p) => {
        p.addEventListener("click", () => {
          document.querySelectorAll("#bedsPills .pill")
            .forEach((x) => x.classList.remove("active"));
          p.classList.add("active");
          state.beds = p.dataset.beds;
          render();
        });
      });
      document.getElementById("sqftMin").addEventListener("input", (e) => {
        state.sqftMin = Number(e.target.value) || 0;
        render();
      });
      document.getElementById("sqftMax").addEventListener("input", (e) => {
        state.sqftMax = Number(e.target.value) || 99999;
        render();
      });
    }

    async function load() {
      try {
        const res = await fetch(csvUrlWithCacheBust());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        state.rows = parseCSV(text);

        const allTs = [...new Set(state.rows.map((r) => r.timestamp))].sort();
        const latest = allTs[allTs.length - 1];
        const dt = new Date(latest);
        document.getElementById("meta").innerHTML = `
          Last scrape: <strong>${dt.toLocaleString()}</strong>
          · ${allTs.length} snapshot${allTs.length === 1 ? "" : "s"}
          · ${state.rows.filter((r) => r.timestamp === latest).length} units in latest
        `;
        attachFilters();
        render();
      } catch (err) {
        document.getElementById("meta").textContent = "Failed to load: " + err.message;
        console.error(err);
      }
    }

    load();
  </script>
</body>
</html>
